name: Build iOS IPA
on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Unpack archives
        run: |
          mkdir -p src_combined
          for z in *.zip; do
            echo "Extracting $z..."
            unzip -q -o "$z" -d src_combined
          done
      - name: Install tools
        run: |
          brew install xcodegen cmake ninja sdl3 curl glm
      - name: Build engine and generate iOS IPA
        run: |
          set -e
          ROOT="$(pwd)/src_combined"
          BUILD_DIR="$(pwd)/build_out"
          IPA_ROOT="$(pwd)/ipa_package"
          mkdir -p "$BUILD_DIR" "$IPA_ROOT/Payload"
          CURL_PREFIX="$(brew --prefix curl)"
          GLM_PREFIX="$(brew --prefix glm)"
          CURL_CMAKE_DIR="$BUILD_DIR/curl_cmake"
          mkdir -p "$CURL_CMAKE_DIR"
          cat > "$CURL_CMAKE_DIR/CURLConfig.cmake" <<EOF
          include_guard(GLOBAL)
          set(CURL_FOUND TRUE)
          set(CURL_INCLUDE_DIRS "$CURL_PREFIX/include")
          set(CURL_LIBRARIES "$CURL_PREFIX/lib/libcurl.dylib")
          if(NOT TARGET CURL::libcurl)
            add_library(CURL::libcurl SHARED IMPORTED)
            set_target_properties(CURL::libcurl PROPERTIES
              IMPORTED_LOCATION "$CURL_PREFIX/lib/libcurl.dylib"
              INTERFACE_INCLUDE_DIRECTORIES "$CURL_PREFIX/include"
            )
          endif()
          EOF
          cp "$CURL_CMAKE_DIR/CURLConfig.cmake" "$CURL_CMAKE_DIR/curl-config.cmake"
          WIN_BASE_HDR="$(find "$ROOT" -name "windows_base.h" 2>/dev/null | head -n 1 || true)"
          EXTRA_INC=""
          if [ -n "$WIN_BASE_HDR" ]; then
            WIN_BASE_DIR="$(dirname "$WIN_BASE_HDR")"
            EXTRA_INC="$WIN_BASE_DIR"
            echo "Found windows_base.h at: $WIN_BASE_DIR"
          else
            WIN_BASE_DIR="$BUILD_DIR/win_compat_inc"
            mkdir -p "$WIN_BASE_DIR"
            cat > "$WIN_BASE_DIR/windows_base.h" <<'WEOF'
          #pragma once
          #include <cstdint>
          #include <cstring>
          using DWORD = uint32_t;
          using WORD = uint16_t;
          using BYTE = uint8_t;
          using BOOL = int32_t;
          using WINBOOL = int32_t;
          using LONG = int32_t;
          using ULONG = uint32_t;
          using LONGLONG = int64_t;
          using ULONGLONG = uint64_t;
          using UINT = uint32_t;
          using INT = int32_t;
          using WCHAR = wchar_t;
          using LPSTR = char*;
          using LPCSTR = const char*;
          using LPWSTR = wchar_t*;
          using LPCWSTR = const wchar_t*;
          using LPVOID = void*;
          using LPCVOID = const void*;
          using HANDLE = void*;
          typedef union _LARGE_INTEGER {
            struct { DWORD LowPart; LONG HighPart; };
            long long QuadPart;
          } LARGE_INTEGER;
          typedef union _ULARGE_INTEGER {
            struct { DWORD LowPart; DWORD HighPart; };
            unsigned long long QuadPart;
          } ULARGE_INTEGER;
          #ifndef TRUE
          #define TRUE 1
          #endif
          #ifndef FALSE
          #define FALSE 0
          #endif
          WEOF
            EXTRA_INC="$WIN_BASE_DIR"
            echo "Created fallback windows_base.h at: $WIN_BASE_DIR"
          fi
          COMPAT_CMAKE="$ROOT/GeneralsMD/Code/CompatLib/CMakeLists.txt"
          if [ -f "$COMPAT_CMAKE" ]; then
            echo "Patching CompatLib"
            python3 -c 'import pathlib,re,sys;p=pathlib.Path(sys.argv[1]);inc=sys.argv[2];winc=sys.argv[3];s=p.read_text(errors="ignore");h=f"set(GLM_FOUND TRUE CACHE BOOL \"\" FORCE)\nset(GLM_INCLUDE_DIRS \"{inc}\" CACHE PATH \"\" FORCE)\ninclude_directories(\"{inc}\" \"{winc}\")\nif(NOT TARGET glm::glm)\nadd_library(glm::glm INTERFACE IMPORTED)\nset_target_properties(glm::glm PROPERTIES INTERFACE_INCLUDE_DIRECTORIES \"{inc}\")\nendif()\nif(NOT TARGET glm::glm-header-only)\nadd_library(glm::glm-header-only INTERFACE IMPORTED)\nset_target_properties(glm::glm-header-only PROPERTIES INTERFACE_INCLUDE_DIRECTORIES \"{inc}\")\nendif()\n";s=re.sub(r"find_package\s*\(\s*glm[^\)]*\)","# glm handled",s,flags=re.I);s=re.sub(r"message\s*\([^\)]*(?:GLM|d3dx8|Homebrew|export set)[^\)]*\)","# glm bypassed",s,flags=re.I|re.S);p.write_text(h+s)' "$COMPAT_CMAKE" "$GLM_PREFIX/include" "$EXTRA_INC"
          fi
          if [ -f "$ROOT/CMakeLists.txt" ]; then
            echo "=== Configuring CMake ==="
            cmake -S "$ROOT" -B "$BUILD_DIR/cmake" -G Ninja \
              -DCMAKE_BUILD_TYPE=Release \
              -DSAGE_USE_SDL3=ON \
              -DCMAKE_PREFIX_PATH="$CURL_CMAKE_DIR;$GLM_PREFIX;$CURL_PREFIX;/opt/homebrew" \
              -DCURL_DIR="$CURL_CMAKE_DIR"
