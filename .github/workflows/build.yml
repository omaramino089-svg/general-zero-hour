name: Build iOS IPA
on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Unpack archives
        run: |
          mkdir -p src_combined
          for z in *.zip; do
            echo "Extracting $z..."
            unzip -q -o "$z" -d src_combined
          done
      - name: Install tools
        run: |
          brew install xcodegen cmake ninja sdl3 curl glm
      - name: Build engine and generate iOS IPA
        run: |
          set -e
          ROOT="$(pwd)/src_combined"
          BUILD_DIR="$(pwd)/build_out"
          IPA_ROOT="$(pwd)/ipa_package"
          mkdir -p "$BUILD_DIR" "$IPA_ROOT/Payload"
          CURL_PREFIX="$(brew --prefix curl)"
          GLM_PREFIX="$(brew --prefix glm)"
          CURL_CMAKE_DIR="$BUILD_DIR/curl_cmake"
          mkdir -p "$CURL_CMAKE_DIR"
          cat > "$CURL_CMAKE_DIR/CURLConfig.cmake" <<EOF
          include_guard(GLOBAL)
          set(CURL_FOUND TRUE)
          set(CURL_INCLUDE_DIRS "$CURL_PREFIX/include")
          set(CURL_LIBRARIES "$CURL_PREFIX/lib/libcurl.dylib")
          if(NOT TARGET CURL::libcurl)
            add_library(CURL::libcurl SHARED IMPORTED)
            set_target_properties(CURL::libcurl PROPERTIES
              IMPORTED_LOCATION "$CURL_PREFIX/lib/libcurl.dylib"
              INTERFACE_INCLUDE_DIRECTORIES "$CURL_PREFIX/include"
            )
          endif()
          EOF
          cp "$CURL_CMAKE_DIR/CURLConfig.cmake" "$CURL_CMAKE_DIR/curl-config.cmake"
          EXTRA_INC="$BUILD_DIR/win_compat_inc"
          mkdir -p "$EXTRA_INC"
          WIN_BASE_HDR="$(find "$ROOT" -name "windows_base.h" 2>/dev/null | head -n 1 || true)"
          if [ -n "$WIN_BASE_HDR" ]; then
            cp -f "$WIN_BASE_HDR" "$EXTRA_INC/windows_base.h"
          else
            cat > "$EXTRA_INC/windows_base.h" <<'WEOF'
          #pragma once
          #include <cstdint>
          #include <cstring>
          using DWORD = uint32_t;
          using WORD = uint16_t;
          using BYTE = uint8_t;
          using BOOL = int32_t;
          using WINBOOL = int32_t;
          using LONG = int32_t;
          using ULONG = uint32_t;
          using LONGLONG = int64_t;
          using ULONGLONG = uint64_t;
          using UINT = uint32_t;
          using INT = int32_t;
          using WCHAR = wchar_t;
          using LPSTR = char*;
          using LPCSTR = const char*;
          using LPWSTR = wchar_t*;
          using LPCWSTR = const wchar_t*;
          using LPVOID = void*;
          using LPCVOID = const void*;
          using HANDLE = void*;
          using HRESULT = int32_t;
          using SIZE_T = size_t;
          typedef struct tagPALETTEENTRY {
            BYTE peRed;
            BYTE peGreen;
            BYTE peBlue;
            BYTE peFlags;
          } PALETTEENTRY, *PPALETTEENTRY, *LPPALETTEENTRY;
          typedef const PALETTEENTRY *LPCPALETTEENTRY;
          typedef struct _MEMORYSTATUS {
            DWORD dwLength;
            DWORD dwMemoryLoad;
            SIZE_T dwTotalPhys;
            SIZE_T dwAvailPhys;
            SIZE_T dwTotalPageFile;
            SIZE_T dwAvailPageFile;
            SIZE_T dwTotalVirtual;
            SIZE_T dwAvailVirtual;
          } MEMORYSTATUS, *LPMEMORYSTATUS;
          typedef union _LARGE_INTEGER {
            struct { DWORD LowPart; LONG HighPart; };
            long long QuadPart;
          } LARGE_INTEGER;
          typedef union _ULARGE_INTEGER {
            struct { DWORD LowPart; DWORD HighPart; };
            unsigned long long QuadPart;
          } ULARGE_INTEGER;
          #ifndef TRUE
          #define TRUE 1
          #endif
          #ifndef FALSE
          #define FALSE 0
          #endif
          #ifndef S_OK
          #define S_OK ((HRESULT)0L)
          #endif
          #ifndef E_FAIL
          #define E_FAIL ((HRESULT)0x80004005L)
          #endif
          #ifndef E_OUTOFMEMORY
          #define E_OUTOFMEMORY ((HRESULT)0x8007000EL)
          #endif
          #ifndef E_INVALIDARG
          #define E_INVALIDARG ((HRESULT)0x80070057L)
          #endif
          #ifndef FAILED
          #define FAILED(hr) (((HRESULT)(hr)) < 0)
          #endif
          WEOF
          fi
          D3D8_SRC="$(find "$ROOT" -name "d3d8.h" 2>/dev/null | head -n 1 || true)"
          if [ -n "$D3D8_SRC" ]; then
            cp -f "$D3D8_SRC" "$EXTRA_INC/d3d8.h"
          else
            cat > "$EXTRA_INC/d3d8.h" <<'D3DEOF'
          #pragma once
          #include <cstdint>
          #include "windows_base.h"
          typedef DWORD D3DCOLOR;
          typedef struct _D3DVECTOR { float x, y, z; } D3DVECTOR;
          typedef struct _D3DMATRIX {
            union {
              struct {
                float _11, _12, _13, _14;
                float _21, _22, _23, _24;
                float _31, _32, _33, _34;
                float _41, _42, _43, _44;
              };
              float m[4][4];
            };
          } D3DMATRIX;
          typedef struct _D3DCOLORVALUE { float r, g, b, a; } D3DCOLORVALUE;
          typedef struct _D3DVIEWPORT8 { DWORD X, Y, Width, Height; float MinZ, MaxZ; } D3DVIEWPORT8;
          typedef struct _D3DLIGHT8 {
            DWORD Type; D3DCOLORVALUE Diffuse, Specular, Ambient; D3DVECTOR Position, Direction;
            float Range, Falloff, Attenuation0, Attenuation1, Attenuation2, Theta, Phi;
          } D3DLIGHT8;
          typedef struct _D3DMATERIAL8 { D3DCOLORVALUE Diffuse, Ambient, Specular, Emissive; float Power; } D3DMATERIAL8;
          typedef enum _D3DFORMAT { D3DFMT_UNKNOWN = 0, D3DFMT_A8R8G8B8 = 21, D3DFMT_X8R8G8B8 = 22, D3DFMT_R5G6B5 = 23, D3DFMT_D24S8 = 75, D3DFMT_FORCE_DWORD = 0x7fffffff } D3DFORMAT;
          typedef enum _D3DPOOL { D3DPOOL_DEFAULT = 0, D3DPOOL_MANAGED = 1, D3DPOOL_SYSTEMMEM = 2, D3DPOOL_FORCE_DWORD = 0x7fffffff } D3DPOOL;
          typedef enum _D3DRESOURCETYPE { D3DRTYPE_SURFACE = 1, D3DRTYPE_VOLUME = 2, D3DRTYPE_TEXTURE = 3, D3DRTYPE_VOLUMETEXTURE = 4, D3DRTYPE_CUBETEXTURE = 5, D3DRTYPE_VERTEXBUFFER = 6, D3DRTYPE_INDEXBUFFER = 7, D3DRTYPE_FORCE_DWORD = 0x7fffffff } D3DRESOURCETYPE;
          struct IDirect3D8; struct IDirect3DDevice8; struct IDirect3DResource8;
          struct IDirect3DBaseTexture8; struct IDirect3DTexture8; struct IDirect3DCubeTexture8;
          struct IDirect3DVolumeTexture8; struct IDirect3DVertexBuffer8; struct IDirect3DIndexBuffer8;
          struct IDirect3DSurface8; struct IDirect3DVolume8; struct IDirect3DSwapChain8;
          typedef struct IDirect3D8 *LPDIRECT3D8, *PDIRECT3D8;
          typedef struct IDirect3DDevice8 *LPDIRECT3DDEVICE8, *PDIRECT3DDEVICE8;
          typedef struct IDirect3DResource8 *LPDIRECT3DRESOURCE8, *PDIRECT3DRESOURCE8;
          typedef struct IDirect3DBaseTexture8 *LPDIRECT3DBASETEXTURE8, *PDIRECT3DBASETEXTURE8;
          typedef struct IDirect3DTexture8 *LPDIRECT3DTEXTURE8, *PDIRECT3DTEXTURE8;
          typedef struct IDirect3DCubeTexture8 *LPDIRECT3DCUBETEXTURE8, *PDIRECT3DCUBETEXTURE8;
          typedef struct IDirect3DVolumeTexture8 *LPDIRECT3DVOLUMETEXTURE8, *PDIRECT3DVOLUMETEXTURE8;
          typedef struct IDirect3DVertexBuffer8 *LPDIRECT3DVERTEXBUFFER8, *PDIRECT3DVERTEXBUFFER8;
          typedef struct IDirect3DIndexBuffer8 *LPDIRECT3DINDEXBUFFER8, *PDIRECT3DINDEXBUFFER8;
          typedef struct IDirect3DSurface8 *LPDIRECT3DSURFACE8, *PDIRECT3DSURFACE8;
          typedef struct IDirect3DVolume8 *LPDIRECT3DVOLUME8, *PDIRECT3DVOLUME8;
          typedef struct IDirect3DSwapChain8 *LPDIRECT3DSWAPCHAIN8, *PDIRECT3DSWAPCHAIN8;
          #define D3D_OK 0L
          #define D3D_SDK_VERSION 220
          #define D3DERR_WRONGTEXTUREFORMAT ((HRESULT)0x88760866L)
          #define D3DERR_UNSUPPORTEDCOLOROPERATION ((HRESULT)0x88760867L)
          #define D3DERR_UNSUPPORTEDCOLORARG ((HRESULT)0x88760868L)
          #define D3DERR_UNSUPPORTEDALPHAOPERATION ((HRESULT)0x88760869L)
          #define D3DERR_UNSUPPORTEDALPHAARG ((HRESULT)0x8876086AL)
          #define D3DERR_TOOMANYOPERATIONS ((HRESULT)0x8876086BL)
          #define D3DERR_CONFLICTINGTEXTUREFILTER ((HRESULT)0x8876086CL)
          #define D3DERR_UNSUPPORTEDFACTORVALUE ((HRESULT)0x8876086DL)
          #define D3DERR_CONFLICTINGRENDERSTATE ((HRESULT)0x8876086EL)
          #define D3DERR_UNSUPPORTEDTEXTUREFILTER ((HRESULT)0x8876086FL)
          #define D3DERR_CONFLICTINGTEXTUREPALETTE ((HRESULT)0x88760870L)
          #define D3DERR_NOTFOUND ((HRESULT)0x88760873L)
          #define D3DERR_MOREDATA ((HRESULT)0x88760874L)
          #define D3DERR_DEVICELOST ((HRESULT)0x88760876L)
          #define D3DERR_DEVICENOTRESET ((HRESULT)0x88760877L)
          #define D3DERR_NOTAVAILABLE ((HRESULT)0x88760878L)
          #define D3DERR_OUTOFVIDEOMEMORY ((HRESULT)0x8876087CL)
          #define D3DERR_INVALIDDEVICE ((HRESULT)0x8876087EL)
          #define D3DERR_INVALIDCALL ((HRESULT)0x8876087FL)
          #define D3DERR_DRIVERINVALIDCALL ((HRESULT)0x88760880L)
          #define D3DCOLOR_ARGB(a,r,g,b) ((D3DCOLOR)(((((a)&0xffu)<<24)|(((r)&0xffu)<<16)|(((g)&0xffu)<<8)|((b)&0xffu))))
          #define D3DCOLOR_RGBA(r,g,b,a) D3DCOLOR_ARGB(a,r,g,b)
          #define D3DCOLOR_XRGB(r,g,b) D3DCOLOR_ARGB(0xffu,r,g,b)
          D3DEOF
          fi
          COMPAT_CMAKE="$ROOT/GeneralsMD/Code/CompatLib/CMakeLists.txt"
          if [ -f "$COMPAT_CMAKE" ]; then
            echo "Patching CompatLib"
            cat << 'PYEOF' > "$BUILD_DIR/patch.py"
          import re, sys
          from pathlib import Path
          p = Path(sys.argv[1])
          inc = sys.argv[2]
          winc = sys.argv[3]
          s = p.read_text(errors="ignore")
          lines = [
              'set(GLM_FOUND TRUE CACHE BOOL "" FORCE)',
              'set(GLM_INCLUDE_DIRS "' + inc + '" CACHE PATH "" FORCE)',
              'include_directories("' + inc + '" "' + winc + '")',
              'if(NOT TARGET glm::glm)',
              'add_library(glm::glm INTERFACE IMPORTED)',
              'set_target_properties(glm::glm PROPERTIES INTERFACE_INCLUDE_DIRECTORIES "' + inc + '")',
              'endif()',
              'if(NOT TARGET glm::glm-header-only)',
              'add_library(glm::glm-header-only INTERFACE IMPORTED)',
              'set_target_properties(glm::glm-header-only PROPERTIES INTERFACE_INCLUDE_DIRECTORIES "' + inc + '")',
              'endif()',
          ]
          h = "\n".join(lines) + "\n"
          s = re.sub(r"find_package\s*\(\s*glm[^\)]*\)", "# glm handled", s, flags=re.I)
          s = re.sub(r"message\s*\([^\)]*(?:GLM|d3dx8|Homebrew|export set)[^\)]*\)", "# glm bypassed", s, flags=re.I|re.S)
          p.write_text(h + s)
          PYEOF
            python3 "$BUILD_DIR/patch.py" "$COMPAT_CMAKE" "$GLM_PREFIX/include" "$EXTRA_INC"
          fi
          if [ -f "$ROOT/CMakeLists.txt" ]; then
            echo "=== Configuring CMake ==="
            cmake -S "$ROOT" -B "$BUILD_DIR/cmake" -G Ninja \
              -DCMAKE_BUILD_TYPE=Release \
              -DSAGE_USE_SDL3=ON \
              -DCMAKE_PREFIX_PATH="$CURL_CMAKE_DIR;$GLM_PREFIX;$CURL_PREFIX;/opt/homebrew" \
              -DCURL_DIR="$CURL_CMAKE_DIR" \
              -DCURL_LIBRARY="$CURL_PREFIX/lib/libcurl.dylib" \
              -DCURL_INCLUDE_DIR="$CURL_PREFIX/include" \
              -DCMAKE_CXX_FLAGS="-I$GLM_PREFIX/include -I$EXTRA_INC -Wno-macro-redefined" \
              -DCMAKE_C_FLAGS="-I$GLM_PREFIX/include -I$EXTRA_INC -Wno-macro-redefined"
            echo "=== Building CMake targets ==="
            ninja -C "$BUILD_DIR/cmake" -k 1
          fi
          if [ -f "$ROOT/ios/project.yml" ]; then
            echo "=== Generating and building Xcode project ==="
            cd "$ROOT/ios"
            xcodegen generate
            xcodebuild \
              -project GeneralsXZH.xcodeproj \
              -scheme GeneralsXZH \
              -sdk iphoneos \
              -configuration Release \
              -derivedDataPath "$BUILD_DIR/derived" \
              CODE_SIGNING_ALLOWED=NO \
              CODE_SIGNING_REQUIRED=NO \
              CODE_SIGN_IDENTITY="" \
              AD_HOC_CODE_SIGNING_ALLOWED=YES \
              build
          fi
          APP_PATH=$(find "$BUILD_DIR" -name "*.app" -type d | head -n 1)
          if [ -n "$APP_PATH" ]; then
            echo "=== Found app: $APP_PATH ==="
            ls -lh "$APP_PATH"
            ENGINE_BIN=$(find "$BUILD_DIR/cmake" -type f -perm +111 \( -name "*generals*" -o
