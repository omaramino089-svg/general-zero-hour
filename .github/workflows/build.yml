name: Build iOS IPA

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Unpack archives
        run: |
          mkdir -p src_combined
          for z in *.zip; do
            echo "Extracting $z..."
            unzip -q -o "$z" -d src_combined
          done

      - name: Inspect iOS and scripts folders
        run: |
          echo "=== Contents of src_combined/ios ==="
          ls -la src_combined/ios 2>/dev/null || echo "No src_combined/ios"
          echo "=== Contents of src_combined/scripts ==="
          ls -la src_combined/scripts 2>/dev/null || echo "No src_combined/scripts"
          echo "=== Xcode projects / workspaces / plists ==="
          find src_combined -maxdepth 4 \( -name "*.xcodeproj" -o -name "*.xcworkspace" -o -name "*ios*" -o -name "*script*" \)
