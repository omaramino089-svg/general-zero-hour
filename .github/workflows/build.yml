name: Build iOS IPA
on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Unpack archives
        run: |
          set -e
          mkdir -p src_combined
          for z in *.zip; do
            if [ -f "$z" ]; then
              unzip -q -o "$z" -d src_combined
            fi
          done
          ls -la src_combined
      - name: Install tools
        run: |
          set -e
          brew install xcodegen cmake ninja sdl3 curl glm
      - name: Prepare compatibility headers
        run: |
          set -e
          mkdir -p build_out/win_compat_inc build_out/curl_cmake
          CURL_PREFIX="$(brew --prefix curl)"
          cat > build_out/curl_cmake/CURLConfig.cmake <<EOF
          include_guard(GLOBAL)
          set(CURL_FOUND TRUE)
          set(CURL_INCLUDE_DIRS "$CURL_PREFIX/include")
          set(CURL_LIBRARIES "$CURL_PREFIX/lib/libcurl.dylib")
          if(NOT TARGET CURL::libcurl)
            add_library(CURL::libcurl SHARED IMPORTED)
            set_target_properties(CURL::libcurl PROPERTIES
              IMPORTED_LOCATION "$CURL_PREFIX/lib/libcurl.dylib"
              INTERFACE_INCLUDE_DIRECTORIES "$CURL_PREFIX/include"
            )
          endif()
          EOF
          cp build_out/curl_cmake/CURLConfig.cmake build_out/curl_cmake/curl-config.cmake
          cat > build_out/win_compat_inc/windows_base.h <<'WEOF'
          #pragma once
          #include <cstdint>
          #include <cstring>
          using DWORD = uint32_t; using WORD = uint16_t; using BYTE = uint8_t;
          using BOOL = int32_t; using WINBOOL = int32_t; using LONG = int32_t;
          using ULONG = uint32_t; using LONGLONG = int64_t; using ULONGLONG = uint64_t;
          using UINT = uint32_t; using INT = int32_t; using FLOAT = float;
          using WCHAR = wchar_t; using LPSTR = char*; using LPCSTR = const char*;
          using LPWSTR = wchar_t*; using LPCWSTR = const wchar_t*;
          using LPVOID = void*; using LPCVOID = const void*;
          using HANDLE = void*; using HWND = void*; using HMODULE = void*;
          using HINSTANCE = void*; using HDC = void*; using HRESULT = int32_t;
          using SIZE_T = size_t;
          struct PALETTEENTRY { BYTE peRed, peGreen, peBlue, peFlags; };
          typedef PALETTEENTRY *PPALETTEENTRY, *LPPALETTEENTRY;
          typedef const PALETTEENTRY *LPCPALETTEENTRY;
          struct RECT { LONG left, top, right, bottom; };
          typedef RECT *PRECT, *LPRECT;
          typedef const RECT *LPCRECT;
          struct POINT { LONG x, y; };
          typedef POINT *PPOINT, *LPPOINT;
          typedef struct _MEMORYSTATUS {
            DWORD dwLength, dwMemoryLoad;
            SIZE_T dwTotalPhys, dwAvailPhys, dwTotalPageFile, dwAvailPageFile, dwTotalVirtual, dwAvailVirtual;
          } MEMORYSTATUS, *LPMEMORYSTATUS;
          typedef union _LARGE_INTEGER { struct { DWORD LowPart; LONG HighPart; }; long long QuadPart; } LARGE_INTEGER;
          typedef union _ULARGE_INTEGER { struct { DWORD LowPart; DWORD HighPart; }; unsigned long long QuadPart; } ULARGE_INTEGER;
          #ifndef TRUE
          #define TRUE 1
          #endif
          #ifndef FALSE
          #define FALSE 0
          #endif
          #ifndef S_OK
          #define S_OK ((HRESULT)0L)
          #endif
          #ifndef E_FAIL
          #define E_FAIL ((HRESULT)0x80004005L)
          #endif
          #ifndef E_OUTOFMEMORY
          #define E_OUTOFMEMORY ((HRESULT)0x8007000EL)
          #endif
          #ifndef E_INVALIDARG
          #define E_INVALIDARG ((HRESULT)0x80070057L)
          #endif
          #ifndef FAILED
          #define FAILED(hr) (((HRESULT)(hr)) < 0)
          #endif
          #ifndef SUCCEEDED
          #define SUCCEEDED(hr) (((HRESULT)(hr)) >= 0)
          #endif
          WEOF
          cat > build_out/win_compat_inc/d3d8.h <<'D3DEOF'
          #pragma once
          #include <cstdint>
          #include "windows_base.h"
          typedef DWORD D3DCOLOR;
          typedef struct _D3DVECTOR { float x, y, z; } D3DVECTOR;
          typedef struct _D3DMATRIX {
            union {
              struct { float _11, _12, _13, _14, _21, _22, _23, _24, _31, _32, _33, _34, _41, _42, _43, _44; };
              float m[4][4];
            };
          } D3DMATRIX;
          typedef struct _D3DCOLORVALUE { float r, g, b, a; } D3DCOLORVALUE;
          typedef struct _D3DVIEWPORT8 { DWORD X, Y, Width, Height; float MinZ, MaxZ; } D3DVIEWPORT8;
          typedef struct _D3DLIGHT8 {
            DWORD Type; D3DCOLORVALUE Diffuse, Specular, Ambient; D3DVECTOR Position, Direction;
            float Range, Falloff, Attenuation0, Attenuation1, Attenuation2, Theta, Phi;
          } D3DLIGHT8;
          typedef struct _D3DMATERIAL8 { D3DCOLORVALUE Diffuse, Ambient, Specular, Emissive; float Power; } D3DMATERIAL8;
          typedef struct _D3DSURFACE_DESC { DWORD Format, Type, Usage, Pool; UINT Size; DWORD MultiSampleType; UINT Width, Height; } D3DSURFACE_DESC;
          typedef struct _D3DVOLUME_DESC { DWORD Format, Type, Usage, Pool; UINT Width, Height, Depth; } D3DVOLUME_DESC;
          typedef struct _D3DLOCKED_RECT { INT Pitch; void* pBits; } D3DLOCKED_RECT;
          typedef struct _D3DLOCKED_BOX { INT RowPitch; INT SlicePitch; void* pBits; } D3DLOCKED_BOX;
          typedef struct _D3DVERTEXBUFFER_DESC { DWORD Format, Type, Usage, Pool; UINT Size, FVF; } D3DVERTEXBUFFER_DESC;
          typedef struct _D3DINDEXBUFFER_DESC { DWORD Format, Type, Usage, Pool; UINT Size; } D3DINDEXBUFFER_DESC;
          typedef struct _D3DPRESENT_PARAMETERS_ {
            UINT BackBufferWidth, BackBufferHeight; DWORD BackBufferFormat; UINT BackBufferCount;
            DWORD MultiSampleType, SwapEffect; HWND hDeviceWindow; BOOL Windowed, EnableAutoDepthStencil;
            DWORD AutoDepthStencilFormat, Flags; UINT FullScreen_RefreshRateInHz, FullScreen_PresentationInterval;
          } D3DPRESENT_PARAMETERS;
          typedef struct _D3DDISPLAYMODE { UINT Width, Height, RefreshRate; DWORD Format; } D3DDISPLAYMODE;
          typedef enum _D3DFORMAT {
            D3DFMT_UNKNOWN = 0, D3DFMT_A8R8G8B8 = 21, D3DFMT_X8R8G8B8 = 22, D3DFMT_R5G6B5 = 23,
            D3DFMT_A1R5G5B5 = 25, D3DFMT_A4R4G4B4 = 26, D3DFMT_R8G8B8 = 20, D3DFMT_A8 = 28,
            D3DFMT_L8 = 50, D3DFMT_A8L8 = 51, D3DFMT_DXT1 = 0x31545844, D3DFMT_DXT2 = 0x32545844,
            D3DFMT_DXT3 = 0x33545844, D3DFMT_DXT4 = 0x34545844, D3DFMT_DXT5 = 0x35545844,
            D3DFMT_D16 = 80, D3DFMT_D24S8 = 75, D3DFMT_D32 = 71, D3DFMT_FORCE_DWORD = 0x7fffffff
          } D3DFORMAT;
          typedef enum _D3DPOOL { D3DPOOL_DEFAULT = 0, D3DPOOL_MANAGED = 1, D3DPOOL_SYSTEMMEM = 2, D3DPOOL_SCRATCH = 3, D3DPOOL_FORCE_DWORD = 0x7fffffff } D3DPOOL;
          typedef enum _D3DRESOURCETYPE { D3DRTYPE_SURFACE = 1, D3DRTYPE_VOLUME = 2, D3DRTYPE_TEXTURE = 3, D3DRTYPE_VOLUMETEXTURE = 4, D3DRTYPE_CUBETEXTURE = 5, D3DRTYPE_VERTEXBUFFER = 6, D3DRTYPE_INDEXBUFFER = 7, D3DRTYPE_FORCE_DWORD = 0x7fffffff } D3DRESOURCETYPE;
          typedef enum _D3DTRANSFORMSTATETYPE { D3DTS_VIEW = 2, D3DTS_PROJECTION = 3, D3DTS_WORLD = 256, D3DTS_TEXTURE0 = 16, D3DTS_FORCE_DWORD = 0x7fffffff } D3DTRANSFORMSTATETYPE;
          typedef enum _D3DRENDERSTATETYPE {
            D3DRS_ZENABLE = 7, D3DRS_FILLMODE = 8, D3DRS_SHADEMODE = 9, D3DRS_ZWRITEENABLE = 14,
            D3DRS_ALPHATESTENABLE = 15, D3DRS_SRCBLEND = 19, D3DRS_DESTBLEND = 20, D3DRS_CULLMODE = 22,
            D3DRS_ZFUNC = 23, D3DRS_ALPHAREF = 24, D3DRS_ALPHAFUNC = 25, D3DRS_DITHERENABLE = 26,
            D3DRS_ALPHABLENDENABLE = 27, D3DRS_FOGENABLE = 28, D3DRS_FOGCOLOR = 34, D3DRS_FOGSTART = 36,
            D3DRS_FOGEND = 37, D3DRS_FOGDENSITY = 38, D3DRS_LIGHTING = 137, D3DRS_AMBIENT = 139,
            D3DRS_TEXTUREFACTOR = 147, D3DRS_FORCE_DWORD = 0x7fffffff
          } D3DRENDERSTATETYPE;
          typedef enum _D3DTEXTURESTAGESTATETYPE {
            D3DTSS_COLOROP = 1, D3DTSS_COLORARG1 = 2, D3DTSS_COLORARG2 = 3, D3DTSS_ALPHAOP = 4,
            D3DTSS_ALPHAARG1 = 5, D3DTSS_ALPHAARG2 = 6, D3DTSS_TEXCOORDINDEX = 11, D3DTSS_ADDRESSU = 13,
            D3DTSS_ADDRESSV = 14, D3DTSS_MAGFILTER = 16, D3DTSS_MINFILTER = 17, D3DTSS_MIPFILTER = 18,
            D3DTSS_FORCE_DWORD = 0x7fffffff
          } D3DTEXTURESTAGESTATETYPE;
          struct IDirect3D8;
          struct IDirect3DDevice8;
          struct IDirect3DResource8;
          struct IDirect3DBaseTexture8;
          struct IDirect3DTexture8;
          struct IDirect3DCubeTexture8;
          struct IDirect3DVolumeTexture8;
          struct IDirect3DVertexBuffer8;
          struct
