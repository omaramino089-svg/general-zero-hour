name: Build iOS IPA
on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Unpack archives
        run: |
          set -e
          mkdir -p src_combined
          for z in *.zip; do
            if [ -f "$z" ]; then
              unzip -q -o "$z" -d src_combined
            fi
          done
          ls -la src_combined
      - name: Install tools
        run: |
          set -e
          brew install xcodegen cmake ninja sdl3 curl glm
      - name: Prepare compatibility headers
        run: |
          set -e
          mkdir -p build_out/win_compat_inc build_out/curl_cmake
          CURL_PREFIX="$(brew --prefix curl)"
          cat > build_out/curl_cmake/CURLConfig.cmake <<EOF
          include_guard(GLOBAL)
          set(CURL_FOUND TRUE)
          set(CURL_INCLUDE_DIRS "$CURL_PREFIX/include")
          set(CURL_LIBRARIES "$CURL_PREFIX/lib/libcurl.dylib")
          if(NOT TARGET CURL::libcurl)
            add_library(CURL::libcurl SHARED IMPORTED)
            set_target_properties(CURL::libcurl PROPERTIES
              IMPORTED_LOCATION "$CURL_PREFIX/lib/libcurl.dylib"
              INTERFACE_INCLUDE_DIRECTORIES "$CURL_PREFIX/include"
            )
          endif()
          EOF
          cp build_out/curl_cmake/CURLConfig.cmake build_out/curl_cmake/curl-config.cmake
          cat > build_out/win_compat_inc/windows_base.h <<'WEOF'
          #pragma once
          #include <cstdint>
          #include <cstring>
          using DWORD = uint32_t; using WORD = uint16_t; using BYTE = uint8_t;
          using BOOL = int32_t; using WINBOOL = int32_t; using LONG = int32_t;
          using ULONG = uint32_t; using LONGLONG = int64_t; using ULONGLONG = uint64_t;
          using UINT = uint32_t; using INT = int32_t; using FLOAT = float;
          using WCHAR = wchar_t; using LPSTR = char*; using LPCSTR = const char*;
          using LPWSTR = wchar_t*; using LPCWSTR = const wchar_t*;
          using LPVOID = void*; using LPCVOID = const void*;
          using HANDLE = void*; using HWND = void*; using HMODULE = void*;
          using HINSTANCE = void*; using HDC = void*; using HRESULT = int32_t;
          using SIZE_T = size_t;
          struct PALETTEENTRY { BYTE peRed, peGreen, peBlue, peFlags; };
          typedef PALETTEENTRY *PPALETTEENTRY, *LPPALETTEENTRY;
          typedef const PALETTEENTRY *LPCPALETTEENTRY;
          struct RECT { LONG left, top, right, bottom; };
          typedef RECT *PRECT, *LPRECT;
          typedef const RECT *LPCRECT;
          struct POINT { LONG x, y; };
          typedef POINT *PPOINT, *LPPOINT;
          typedef struct _MEMORYSTATUS {
            DWORD dwLength, dwMemoryLoad;
            SIZE_T dwTotalPhys, dwAvailPhys, dwTotalPageFile, dwAvailPageFile, dwTotalVirtual, dwAvailVirtual;
          } MEMORYSTATUS, *LPMEMORYSTATUS;
          typedef union _LARGE_INTEGER { struct { DWORD LowPart; LONG HighPart; }; long long QuadPart; } LARGE_INTEGER;
          typedef union _ULARGE_INTEGER { struct { DWORD LowPart; DWORD HighPart; }; unsigned long long QuadPart; } ULARGE_INTEGER;
          #ifndef TRUE
          #define TRUE 1
          #endif
          #ifndef FALSE
          #define FALSE 0
          #endif
          #ifndef S_OK
          #define S_OK ((HRESULT)0L)
          #endif
          #ifndef E_FAIL
          #define E_FAIL ((HRESULT)0x80004005L)
          #endif
          #ifndef E_OUTOFMEMORY
          #define E_OUTOFMEMORY ((HRESULT)0x8007000EL)
          #endif
          #ifndef E_INVALIDARG
          #define E_INVALIDARG ((HRESULT)0x80070057L)
          #endif
          #ifndef FAILED
          #define FAILED(hr) (((HRESULT)(hr)) < 0)
          #endif
          #ifndef SUCCEEDED
          #define SUCCEEDED(hr) (((HRESULT)(hr)) >= 0)
          #endif
          WEOF
          cat > build_out/win_compat_inc/d3d8.h <<'D3DEOF'
          #pragma once
          #include <cstdint>
          #include "windows_base.h"
          typedef DWORD D3DCOLOR;
          typedef struct _D3DVECTOR { float x, y, z; } D3DVECTOR;
          typedef struct _D3DMATRIX {
            union {
              struct { float _11, _12, _13, _14, _21, _22, _23, _24, _31, _32, _33, _34, _41, _42, _43, _44; };
              float m[4][4];
            };
