name: Build GeneralsX Zero Hour iOS IPA

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Initialize DXVK submodule
        run: |
          set -e
          git submodule update --init references/fbraz3-dxvk

      - name: Install build dependencies
        run: |
          set -e
          brew update
          brew install cmake ninja meson pkg-config xcodegen glm sdl3

      - name: Fetch MoltenVK and stage fonts
        run: |
          set -e
          chmod +x scripts/build/ios/*.sh
          ./scripts/build/ios/fetch-moltenvk.sh
          ./scripts/build/ios/stage-fonts.sh

      - name: Configure and build Zero Hour for iOS
        run: |
          set -e
          cmake --preset ios-vulkan
          cmake --build build/ios-vulkan --target z_generals --parallel

      - name: Assemble and package IPA
        run: |
          set -e
          # محاولة تشغيل سكربت التغليف الرسمي بدون التثبيت المباشر (--dev لتخطي ملفات اللعبة الضخمة)
          GX_TEAM_ID="0000000000" GX_BUNDLE_ID="com.generalsx.zerohour" \
            ./scripts/build/ios/package-ios-zh.sh --dev || true

          # البحث عن حزمة .app أو ملف .ipa الناتج وتغليفه بشكل مضمون
          rm -rf ipa_staging GeneralsXZH.ipa
          mkdir -p ipa_staging/Payload

          EXISTING_IPA="$(find . -maxdepth 4 -name "*.ipa" 2>/dev/null | head -n 1 || true)"
          if [ -n "$EXISTING_IPA" ]; then
            echo "Found existing IPA: $EXISTING_IPA"
            cp -f "$EXISTING_IPA" GeneralsXZH.ipa
          else
            APP_BUNDLE="$(find build/ios-vulkan -maxdepth 4 -name "*.app" -type d 2>/dev/null | head -n 1 || true)"
            if [ -n "$APP_BUNDLE" ]; then
              echo "Packaging app bundle: $APP_BUNDLE"
              cp -R "$APP_BUNDLE" ipa_staging/Payload/
              (cd ipa_staging && zip -r -y ../GeneralsXZH.ipa Payload)
            else
              echo "Error: Neither .ipa nor .app bundle was produced."
              find build/ios-vulkan -maxdepth 3
              exit 1
            fi
          fi

          ls -lh GeneralsXZH.ipa

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: GeneralsXZH-iOS-IPA
          path: GeneralsXZH.ipa
          if-no-files-found: error
