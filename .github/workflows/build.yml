name: Build iOS IPA

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Unpack archives
        run: |
          mkdir -p src_combined
          for z in *.zip; do
            echo "Extracting $z..."
            unzip -q -o "$z" -d src_combined
          done

      - name: Inspect project.yml and build scripts
        run: |
          echo "=== ios/project.yml ==="
          cat src_combined/ios/project.yml 2>/dev/null || echo "No ios/project.yml"
          echo "=== scripts/build ==="
          ls -la src_combined/scripts/build 2>/dev/null || echo "No scripts/build"
          for f in src_combined/scripts/build/*; do
            if [ -f "$f" ]; then
              echo "--- File: $f ---"
              cat "$f"
            fi
          done
