          typedef struct _D3DVOLUME_DESC { DWORD Format, Type, Usage, Pool; UINT Width, Height, Depth; } D3DVOLUME_DESC;
          typedef struct _D3DLOCKED_RECT { INT Pitch; void* pBits; } D3DLOCKED_RECT;
          typedef struct _D3DLOCKED_BOX { INT RowPitch; INT SlicePitch; void* pBits; } D3DLOCKED_BOX;
          typedef struct _D3DVERTEXBUFFER_DESC { DWORD Format, Type, Usage, Pool; UINT Size, FVF; } D3DVERTEXBUFFER_DESC;
          typedef struct _D3DINDEXBUFFER_DESC { DWORD Format, Type, Usage, Pool; UINT Size; } D3DINDEXBUFFER_DESC;
          typedef struct _D3DPRESENT_PARAMETERS_ {
            UINT BackBufferWidth, BackBufferHeight; DWORD BackBufferFormat; UINT BackBufferCount;
            DWORD MultiSampleType, SwapEffect; HWND hDeviceWindow; BOOL Windowed, EnableAutoDepthStencil;
            DWORD AutoDepthStencilFormat, Flags; UINT FullScreen_RefreshRateInHz, FullScreen_PresentationInterval;
          } D3DPRESENT_PARAMETERS;
          typedef struct _D3DDISPLAYMODE { UINT Width, Height, RefreshRate; DWORD Format; } D3DDISPLAYMODE;
          typedef enum _D3DFORMAT {
            D3DFMT_UNKNOWN = 0, D3DFMT_A8R8G8B8 = 21, D3DFMT_X8R8G8B8 = 22, D3DFMT_R5G6B5 = 23,
            D3DFMT_A1R5G5B5 = 25, D3DFMT_A4R4G4B4 = 26, D3DFMT_R8G8B8 = 20, D3DFMT_A8 = 28,
            D3DFMT_L8 = 50, D3DFMT_A8L8 = 51, D3DFMT_DXT1 = 0x31545844, D3DFMT_DXT2 = 0x32545844,
            D3DFMT_DXT3 = 0x33545844, D3DFMT_DXT4 = 0x34545844, D3DFMT_DXT5 = 0x35545844,
            D3DFMT_D16 = 80, D3DFMT_D24S8 = 75, D3DFMT_D32 = 71, D3DFMT_FORCE_DWORD = 0x7fffffff
