name: Build iOS IPA
on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Unpack archives
        run: |
          mkdir -p src_combined
          for z in *.zip; do
            echo "Extracting $z..."
            unzip -q -o "$z" -d src_combined
          done
      - name: Install tools
        run: |
          brew install xcodegen cmake ninja sdl3 curl glm
      - name: Build engine and generate iOS IPA
        run: |
          set -e
          ROOT="$(pwd)/src_combined"
          BUILD_DIR="$(pwd)/build_out"
          IPA_ROOT="$(pwd)/ipa_package"
          mkdir -p "$BUILD_DIR" "$IPA_ROOT/Payload"
          CURL_PREFIX="$(brew --prefix curl)"
          GLM_PREFIX="$(brew --prefix glm)"
          CURL_CMAKE_DIR="$BUILD_DIR/curl_cmake"
          mkdir -p "$CURL_CMAKE_DIR"
          cat > "$CURL_CMAKE_DIR/CURLConfig.cmake" <<EOF
          include_guard(GLOBAL)
          set(CURL_FOUND TRUE)
          set(CURL_INCLUDE_DIRS "$CURL_PREFIX/include")
          set(CURL_LIBRARIES "$CURL_PREFIX/lib/libcurl.dylib")
          if(NOT TARGET CURL::libcurl)
            add_library(CURL::libcurl SHARED IMPORTED)
            set_target_properties(CURL::libcurl PROPERTIES
              IMPORTED_LOCATION "$CURL_PREFIX/lib/libcurl.dylib"
              INTERFACE_INCLUDE_DIRECTORIES "$CURL_PREFIX/include"
            )
          endif()
          EOF
          cp "$CURL_CMAKE_DIR/CURLConfig.cmake" "$CURL_CMAKE_DIR/curl-config.cmake"
          EXTRA_INC="$BUILD_DIR/win_compat_inc"
          mkdir -p "$EXTRA_INC"
          WIN_BASE_HDR="$(find "$ROOT" -name "windows_base.h" 2>/dev/null | head -n 1 || true)"
          if [ -n "$WIN_BASE_HDR" ]; then
            cp -f "$WIN_BASE_HDR" "$EXTRA_INC/windows_base.h"
          else
            cat > "$EXTRA_INC/windows_base.h" <<'WEOF'
          #pragma once
          #include <cstdint>
          #include <cstring>
          using DWORD = uint32_t;
          using WORD = uint16_t;
          using BYTE = uint8_t;
          using BOOL = int32_t;
          using WINBOOL = int32_t;
          using LONG = int32_t;
          using ULONG = uint32_t;
          using LONGLONG = int64_t;
          using ULONGLONG = uint64_t;
          using UINT = uint32_t;
          using INT = int32_t;
          using FLOAT = float;
          using WCHAR = wchar_t;
          using LPSTR = char*;
          using LPCSTR = const char*;
          using LPWSTR = wchar_t*;
          using LPCWSTR = const wchar_t*;
          using LPVOID = void*;
          using LPCVOID = const void*;
          using HANDLE = void*;
          using HWND = void*;
          using HMODULE = void*;
          using HINSTANCE = void*;
          using HDC = void*;
          using HRESULT = int32_t;
          using SIZE_T = size_t;
          struct PALETTEENTRY {
            BYTE peRed;
            BYTE peGreen;
            BYTE peBlue;
            BYTE peFlags;
          };
          typedef PALETTEENTRY *PPALETTEENTRY, *LPPALETTEENTRY;
          typedef const PALETTEENTRY *LPCPALETTEENTRY;
          struct RECT {
            LONG left;
            LONG top;
            LONG right;
            LONG bottom;
          };
          typedef RECT *PRECT, *LPRECT;
          typedef const RECT *LPCRECT;
          struct POINT {
            LONG x;
            LONG y;
          };
          typedef POINT *PPOINT, *LPPOINT;
          typedef struct _MEMORYSTATUS {
            DWORD dwLength;
            DWORD dwMemoryLoad;
            SIZE_T dwTotalPhys;
            SIZE_T dwAvailPhys;
            SIZE_T dwTotalPageFile;
            SIZE_T dwAvailPageFile;
            SIZE_T dwTotalVirtual;
            SIZE_T dwAvailVirtual;
          } MEMORYSTATUS, *LPMEMORYSTATUS;
          typedef union _LARGE_INTEGER {
            struct { DWORD LowPart; LONG HighPart; };
            long long QuadPart;
          } LARGE_INTEGER;
          typedef union _ULARGE_INTEGER {
            struct { DWORD LowPart; DWORD HighPart; };
            unsigned long long QuadPart;
          } ULARGE_INTEGER;
          #ifndef TRUE
          #define TRUE 1
          #endif
          #ifndef FALSE
          #define FALSE 0
          #endif
          #ifndef S_OK
          #define S_OK ((HRESULT)0L)
          #endif
          #ifndef E_FAIL
          #define E_FAIL ((HRESULT)0x80004005L)
          #endif
          #ifndef E_OUTOFMEMORY
          #define E_OUTOFMEMORY ((HRESULT)0x8007000EL)
          #endif
          #ifndef E_INVALIDARG
          #define E_INVALIDARG ((HRESULT)0x80070057L)
          #endif
          #ifndef FAILED
          #define FAILED(hr) (((HRESULT)(hr)) < 0)
          #endif
          #ifndef SUCCEEDED
          #define SUCCEEDED(hr) (((HRESULT)(hr)) >= 0)
          #endif
          WEOF
          fi
          D3D8_SRC="$(find "$ROOT" -name "d3d8.h" 2>/dev/null | head -n 1 || true)"
          if [ -n "$D3D8_SRC" ]; then
            cp -f "$D3D8_SRC" "$EXTRA_INC/d3d8.h"
          else
            cat > "$EXTRA_INC/d3d8.h" <<'D3DEOF'
          #pragma once
          #include <cstdint>
          #include "windows_base.h"
          typedef DWORD D3DCOLOR;
          typedef struct _D3DVECTOR { float x, y, z; } D3DVECTOR;
          typedef struct _D3DMATRIX {
            union {
              struct {
                float _11, _12, _13, _14;
                float _21, _22, _23, _24;
                float _31, _32, _33, _34;
                float _41, _42, _43, _44;
              };
              float m[4][4];
            };
          } D3DMATRIX;
          typedef struct _D3DCOLORVALUE { float r, g, b, a; } D3DCOLORVALUE;
          typedef struct _D3DVIEWPORT8 { DWORD X, Y, Width, Height; float MinZ, MaxZ; } D3DVIEWPORT8;
          typedef struct _D3DLIGHT8 {
            DWORD Type; D3DCOLORVALUE Diffuse, Specular, Ambient; D3DVECTOR Position, Direction;
            float Range, Falloff, Attenuation0, Attenuation1, Attenuation2, Theta, Phi;
          } D3DLIGHT8;
          typedef struct _D3DMATERIAL8 { D3DCOLORVALUE Diffuse, Ambient, Specular, Emissive; float Power; } D3DMATERIAL8;
          typedef struct _D3DSURFACE_DESC {
            DWORD Format; DWORD Type; DWORD Usage; DWORD Pool; UINT Size;
            DWORD MultiSampleType; UINT Width; UINT Height;
          } D3DSURFACE_DESC;
          typedef struct _D3DVOLUME_DESC {
            DWORD Format; DWORD Type; DWORD Usage; DWORD Pool;
            UINT Width; UINT Height; UINT Depth;
          } D3DVOLUME_DESC;
          typedef struct _D3DLOCKED_RECT { INT Pitch; void* pBits; } D3DLOCKED_RECT;
          typedef struct _D3DLOCKED_BOX { INT RowPitch; INT SlicePitch; void* pBits; } D3DLOCKED_BOX;
          typedef struct _D3DVERTEXBUFFER_DESC {
            DWORD Format; DWORD Type; DWORD Usage; DWORD Pool; UINT Size; DWORD FVF;
          } D3DVERTEXBUFFER_DESC;
          
